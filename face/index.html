<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="eve-app">
  <header class="eve-top">
    <div>
      <div class="eve-brand">EVE<i aria-hidden="true"></i></div>
      <div class="eve-meta"><b id="eve-state-label">Connecting</b><span id="eve-conn-meta">· mic off · proactivity on</span></div>
    </div>
    <div class="eve-tabs" role="tablist" aria-label="EVE states">
      <button class="eve-tab" type="button" role="tab" aria-selected="true" data-state="quiet">Quiet</button>
      <button class="eve-tab" type="button" role="tab" aria-selected="false" data-state="working">Working</button>
      <button class="eve-tab" type="button" role="tab" aria-selected="false" data-state="review" id="eveTabReview">Review<span class="cnt" hidden></span></button>
      <button class="eve-focus-toggle" id="eveFocusBtn" type="button" aria-pressed="true">Show rail</button>
      <button class="eve-focus-toggle" id="evePauseBtn" type="button" aria-pressed="false" title="Pause all proactive behavior">Pause</button>
      <a class="eve-brain" href="/mind" title="EVE's brain — memory, tools, knowledge">mind</a>
    </div>
  </header>

  <main class="eve-layout orb-only" id="eve-layout">
    <section class="eve-stage" aria-live="polite">
      <div class="eve-kicker" id="eve-kicker">connecting / hello</div>
      <div class="eve-stage-scroll">
        <div id="eve-view"></div>
        <div class="eve-orb-air" id="eve-orb-air"></div>
      </div>
      <form class="eve-prompt" id="eve-prompt" autocomplete="off">
        <input class="eve-input" id="eve-input" aria-label="Talk to EVE" placeholder="Tell EVE what you need…" autocomplete="off" />
        <button class="eve-mic" type="button" id="eveMic" aria-label="Talk to EVE" title="Talk to EVE">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
        </button>
        <button class="eve-send" type="submit" id="eveSend">Send</button>
      </form>
    </section>

    <aside class="eve-side" aria-label="EVE's current work">
      <section class="eve-side-section"><h2>Needs you · <span id="eveCNeeds">0</span></h2><div class="eve-work" id="eveSNeeds"></div></section>
      <section class="eve-side-section"><h2>EVE is handling · <span id="eveCHandling">0</span></h2><div class="eve-work" id="eveSHandling"></div></section>
      <section class="eve-side-section"><h2>Notices · <span id="eveCNotices">0</span></h2><div class="eve-work" id="eveSNotices"></div></section>
      <section class="eve-side-section"><h2>Reminders · <span id="eveCRem">0</span></h2><div class="eve-work" id="eveSRem"></div></section>
      <section class="eve-side-section"><h2>Sub-agents</h2><div class="eve-work" id="eveSAgents"></div></section>
      <div class="eve-foot" id="eve-usage">usage · —</div>
    </aside>
  </main>
</div>

<script type="module" src="shell.js"></script>
</body>
</html>
